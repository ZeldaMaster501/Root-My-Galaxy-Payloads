name: Build exact SM-S928U DZG1 artifacts

on:
  push:
    branches:
      - agent/s928u-dzg1-payload

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Install pinned Zig compiler
        shell: bash
        run: |
          set -euo pipefail
          npm --cache "$RUNNER_TEMP/npm-cache" install \
            --prefix "$RUNNER_TEMP/zig" \
            @oven/zig-linux-x64@0.12.0-dev.1286

      - name: Checkout pinned AOSP Bionic headers
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/aosp-mirror/platform_bionic.git \
            "$RUNNER_TEMP/bionic"
          git -C "$RUNNER_TEMP/bionic" checkout \
            731631f300090436d7f5df80d50b6275c8c60a93

      - name: Build exact DZG1 payload
        shell: bash
        env:
          ZIG: ${{ runner.temp }}/zig/node_modules/@oven/zig-linux-x64/zig
          BIONIC_DIR: ${{ runner.temp }}/bionic
          TARGET: e3q-S928USQS6DZG1
          OUTPUT: artifacts/e3q-S928USQS6DZG1/cve-2026-43499-app.so
        run: |
          set -euo pipefail
          tools/build_android_payload_with_zig.sh

      - name: Generate exact DZG1 KernelSU artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 kernelsu/tools/retarget_embedded_module.py \
            kernelsu/android14-6.1_kernelsu-e3q-S928USQS6DZF2-kdp.ko \
            kernelsu/ksud-e3q-S928USQS6DZF2-kdp \
            kernelsu/android14-6.1_kernelsu-e3q-S928USQS6DZG1-kdp.ko \
            kernelsu/ksud-e3q-S928USQS6DZG1-kdp \
            --old-release 6.1.145-android14-11-33419968-abS928USQS6DZF2 \
            --new-release 6.1.145-android14-11-33419968-abS928USQS6DZG1 \
            --asset-offset 0x11ff0 \
            --asset-size 0x1e70d

      - name: Verify audited artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          cc898e3e9134aaf56c121ea51edecd44f12319f97b3a59ce78faf5cdfa0c5c33  artifacts/e3q-S928USQS6DZG1/cve-2026-43499-app.so
          13ca83e08ef60b3645506fbbc7e62d8cb6176d0a7659fe4b202fccbde84dc9cb  kernelsu/android14-6.1_kernelsu-e3q-S928USQS6DZG1-kdp.ko
          a5f50666f9b917edc89ba410dfac653a44dcc33c17705f732db1b9c57c5afb48  kernelsu/ksud-e3q-S928USQS6DZG1-kdp
          EOF

      - name: Commit verified artifacts and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-dzg1.yml
          git add \
            artifacts/e3q-S928USQS6DZG1/cve-2026-43499-app.so \
            kernelsu/android14-6.1_kernelsu-e3q-S928USQS6DZG1-kdp.ko \
            kernelsu/ksud-e3q-S928USQS6DZG1-kdp
          git commit -m "Add generated SM-S928U DZG1 artifacts"
          git push
